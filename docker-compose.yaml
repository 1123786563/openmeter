services:
  kafka:
    extends:
      file: docker-compose.base.yaml
      service: kafka
    ports:
      - "0.0.0.0:29092:29092"

  clickhouse:
    extends:
      file: docker-compose.base.yaml
      service: clickhouse
    ports:
      - "0.0.0.0:8123:8123"
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9009:9009"

  ch-ui:
    extends:
      file: docker-compose.base.yaml
      service: ch-ui
    profiles:
      - dev
    ports:
      - "${CH_UI_PORT:-5521}:5521"

  # Deduplication
  # docker compose --profile redis up
  redis:
    extends:
      file: docker-compose.base.yaml
      service: redis
    ports:
      - "0.0.0.0:6380:6379"

  # Development
  # docker compose --profile dev up
  kafka-ui:
    extends:
      file: docker-compose.base.yaml
      service: kafka-ui
    profiles:
      - dev
    ports:
      - "0.0.0.0:8084:8080"

  # Credit
  # docker compose --profile postgres up
  postgres:
    extends:
      file: docker-compose.base.yaml
      service: postgres
    ports:
      - "0.0.0.0:5433:5432"

  svix:
    extends:
      file: docker-compose.base.yaml
      service: svix
    ports:
      - "0.0.0.0:8071:8071"

configs:
  svix_sql:
    file: ./svix.sql