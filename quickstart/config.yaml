credits:
  enabled: true
  enableCreditThenInvoice: true
  reservationsEnabled: true

# Quickstart has no Casdoor; API authentication is explicitly disabled.
auth:
  oidc:
    enabled: false

creditReservation:
  enabled: true
  authorizationTTL: 5m
  executionDeadline: 10m
  unknownManualReviewAfter: 1h
  worker:
    pollInterval: 5s
    leaseDuration: 30s
    batchSize: 50
    maxClaimCount: 3

commerce:
  enabled: false
  payment:
    wechat:
      enabled: false
    alipay:
      enabled: false

ingest:
  kafka:
    broker: kafka:9092
    brokerAddressFamily: v4
    socketKeepAliveEnable: true
    topicMetadataRefreshInterval: 10s

aggregation:
  clickhouse:
    address: clickhouse:9000

sink:
  minCommitCount: 1
  namespaceRefetch: 5s
  namespaceRefetchTimeout: 5s
  kafka:
    brokers: kafka:9092
    brokerAddressFamily: v4
    socketKeepAliveEnable: true
    topicMetadataRefreshInterval: 10s
  dedupe:
    enabled: true
    driver: redis
    config:
      address: redis:6379
      database: 0
      expiration: 768h

postgres:
  url: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
  autoMigrate: migration

meters:
  - slug: api_requests_total
    description: API Requests
    eventType: request
    aggregation: COUNT
    groupBy:
      method: $.method
      route: $.route

  - slug: api_requests_duration
    description: API Request Duration
    aggregation: SUM
    eventType: request
    valueProperty: $.duration_ms
    groupBy:
      method: $.method
      route: $.route

  - slug: tokens_total
    description: AI Token Usage
    aggregation: SUM
    eventType: prompt
    valueProperty: $.tokens
    groupBy:
      model: $.model
      type: $.type

portal:
  enabled: true
  tokenSecret: this-isnt-secure

notification:
  enabled: true
