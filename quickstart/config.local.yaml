credits:
  enabled: true
  enableCreditThenInvoice: true
  reservationsEnabled: true

# Local quickstart runs have no Casdoor; API authentication is explicitly disabled.
auth:
  oidc:
    enabled: false

ingest:
  kafka:
    broker: localhost:29092
    brokerAddressFamily: v4
    socketKeepAliveEnable: true
    topicMetadataRefreshInterval: 10s

aggregation:
  clickhouse:
    address: localhost:9000

sink:
  minCommitCount: 1
  namespaceRefetch: 5s
  namespaceRefetchTimeout: 5s
  kafka:
    brokers: localhost:29092
    brokerAddressFamily: v4
    socketKeepAliveEnable: true
    topicMetadataRefreshInterval: 10s
  dedupe:
    enabled: true
    driver: redis
    config:
      address: localhost:6380
      database: 0
      expiration: 768h

postgres:
  url: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
  autoMigrate: migration

meters:
  - slug: api_requests_total
    description: API Requests
    eventType: request
    aggregation: COUNT
    groupBy:
      method: $.method
      route: $.route

  - slug: api_requests_duration
    description: API Request Duration
    aggregation: SUM
    eventType: request
    valueProperty: $.duration_ms
    groupBy:
      method: $.method
      route: $.route

  - slug: tokens_total
    description: AI Token Usage
    aggregation: SUM
    eventType: prompt
    valueProperty: $.tokens
    groupBy:
      model: $.model
      type: $.type

portal:
  enabled: true
  tokenSecret: this-isnt-secure

notification:
  enabled: true
  webhook:
